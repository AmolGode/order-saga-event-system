# Same credentials as api-secret.yaml, kept as its own Secret object since
# the worker connects to order-db directly (no pgbouncer in front of it,
# matching the docker-compose setup — only the API needed pooling under load).
apiVersion: v1
kind: Secret
metadata:
  name: order-service-worker-secret
type: Opaque
stringData:
  POSTGRES_DB: orders
  POSTGRES_USER: order_user
  POSTGRES_PASSWORD: Pass@123

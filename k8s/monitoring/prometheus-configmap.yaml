# Single pod-discovery job instead of the local static-target list (see
# monitoring/prometheus/prometheus.yml) — every pod with prometheus.io/scrape:
# "true" gets picked up automatically, at whatever replica count KEDA has it
# at right now. The `job` label is set from the pod's own `app` label, so it
# comes out identical to the local job_names (order-service-api,
# order-service-worker, ...) — every existing PromQL query and the Grafana
# dashboard JSON work unchanged, they don't know the difference.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: job
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

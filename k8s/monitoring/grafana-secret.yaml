# NOTE: matches docker-compose's GF_SECURITY_ADMIN_USER/PASSWORD for
# local-cluster testing only. Plain-text secrets checked into git are fine
# for a learning setup, not for a real deployment — use sealed-secrets/
# external-secrets/your cloud's secret manager once this goes anywhere real.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: admin

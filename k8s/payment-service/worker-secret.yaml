# Same credentials as api-secret.yaml, kept as its own Secret object since
# the worker connects to payment-db directly, matching the docker-compose
# setup (no pooler in front of it — only order-db needed one under load).
apiVersion: v1
kind: Secret
metadata:
  name: payment-service-worker-secret
type: Opaque
stringData:
  POSTGRES_DB: payments
  POSTGRES_USER: payment_user
  POSTGRES_PASSWORD: Pass@123

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: payment-service-worker-scaler
spec:
  scaleTargetRef:
    name: payment-service-worker
  minReplicaCount: 2
  maxReplicaCount: 10 # matches payment-requested's 10 partitions — the only topic this group consumes
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-broker-0.kafka-broker:9092,kafka-broker-1.kafka-broker:9092,kafka-broker-2.kafka-broker:9092
        consumerGroup: payment-service-worker
        topic: payment-requested
        lagThreshold: "50"
        offsetResetPolicy: earliest

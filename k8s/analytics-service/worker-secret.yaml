# Same credentials as api-secret.yaml, kept as its own Secret object since
# the worker connects to analytics-db directly, matching the docker-compose
# setup (no pooler in front of it — only order-db needed one under load).
apiVersion: v1
kind: Secret
metadata:
  name: analytics-service-worker-secret
type: Opaque
stringData:
  POSTGRES_DB: analytics
  POSTGRES_USER: analytics_user
  POSTGRES_PASSWORD: Pass@123

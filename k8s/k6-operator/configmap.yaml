# Mirrors order_load_test/order_load_test.js exactly. k6-operator loads the
# script from a ConfigMap (it can't read a file straight from this repo) —
# keep this in sync by hand whenever the source script changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-load-test-script
data:
  order_load_test.js: |
    import http from 'k6/http';
    import { check } from 'k6';

    // options = global test config, not per-request.
    //
    // constant-arrival-rate targets a fixed request rate directly, instead of a
    // fixed VU count — with plain `vus`, actual req/sec depends on how fast each
    // request completes, and slows down exactly when the server is under load
    // (the opposite of what you want from a load test). This executor instead
    // auto-scales VUs (up to maxVUs) to hold `rate` steady regardless of latency.
    // BASE_URL: run locally with no env set (defaults to the docker-compose
    // port), or pass -e BASE_URL=http://order-service-api:8000 when running
    // against a real cluster (see k8s/k6-operator/testrun.yaml, which sets this
    // to the in-cluster Service DNS name — there's no localhost:8100 on EKS).
    const BASE_URL = __ENV.BASE_URL || 'http://localhost:8100';

    export const options = {
      scenarios: {
        saga_load: {
          executor: 'constant-arrival-rate',
          rate: 10000, // target: 10k requests/sec — when run via k6-operator, this is the TOTAL across all runner pods, split evenly by parallelism
          timeUnit: '1s',
          duration: '2m',
          // Sized for 10k/sec, not the old 1k/sec target. If actual latency
          // under load is higher than expected, k6 will hit maxVUs before
          // reaching `rate` and silently under-deliver — check the
          // `dropped_iterations` metric in the summary and raise these further
          // if it's non-zero.
          preAllocatedVUs: 3000,
          maxVUs: 20000,
        },
      },
    };

    // Real product IDs from order-service's data/product_data.json — the API
    // validates product_id against this file, so a random UUID would just 400.
    const PRODUCT_IDS = [
      '234bf452-a77c-48aa-86f4-bb0b358ba778',
      'd2350b96-e9fd-401d-8b47-3fa62f5249d9',
      'ee4c2554-84a3-4e78-94bc-8665326e5934',
    ];

    function randomProductId() {
      return PRODUCT_IDS[Math.floor(Math.random() * PRODUCT_IDS.length)];
    }

    // This function is what k6 actually runs — every VU calls it in a tight
    // loop, over and over, until `duration` elapses. One call = one iteration.
    export default function () {
      const payload = JSON.stringify({
        customer_id: crypto.randomUUID(),
        product_id: randomProductId(),
        qty: Math.floor(Math.random() * 5) + 1, // 1-5
      });

      // http.post(url, body, params) — a single HTTP request.
      const res = http.post(`${BASE_URL}/orders/create_order/`, payload, {
        headers: { 'Content-Type': 'application/json' },
      });

      // check() is k6's assertion — it doesn't stop the test on failure, it just
      // records a pass/fail rate you see in the final summary.
      check(res, { 'status is 201': (r) => r.status === 201 });
    }

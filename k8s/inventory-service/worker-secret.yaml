# Same credentials as api-secret.yaml, kept as its own Secret object since
# the worker connects to inventory-db directly, matching the docker-compose
# setup (no pooler in front of it — only order-db needed one under load).
apiVersion: v1
kind: Secret
metadata:
  name: inventory-service-worker-secret
type: Opaque
stringData:
  POSTGRES_DB: inventory
  POSTGRES_USER: inventory_user
  POSTGRES_PASSWORD: Pass@123

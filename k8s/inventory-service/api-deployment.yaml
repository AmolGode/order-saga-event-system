apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service-api
  template:
    metadata:
      labels:
        app: inventory-service-api
    spec:
      containers:
        - name: inventory-service-api
          # Placeholder — for real EKS this must be the ECR repo URL from
          # `terraform output ecr_repository_urls`, with a real build tag
          # (git SHA or build number), not :latest. Add this repo to
          # terraform/ecr.tf's ecr_repos list before pushing.
          image: order-saga-event-system-inventory-service-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: inventory-service-api-secret
          env:
            - name: POSTGRES_HOST
              value: inventory-db
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-broker:9092
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15

# NOTE: values here match your local .env for local-cluster testing only.
# Plain-text secrets checked into git are fine for a learning setup, not for
# a real deployment — use sealed-secrets/external-secrets/your cloud's
# secret manager once this goes anywhere real (e.g. the EKS pass later).
apiVersion: v1
kind: Secret
metadata:
  name: inventory-service-api-secret
type: Opaque
stringData:
  POSTGRES_DB: inventory
  POSTGRES_USER: inventory_user
  POSTGRES_PASSWORD: Pass@123

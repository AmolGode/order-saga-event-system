services:
  order-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    volumes:
      - order_db_data:/var/lib/postgresql/data

  # Sits between order-service-api and order-db: accepts up to MAX_CLIENT_CONN
  # connections from Django but only ever holds DEFAULT_POOL_SIZE real
  # connections open to Postgres, queuing the rest briefly instead of Postgres
  # rejecting them outright ("too many clients already").
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    environment:
      DB_HOST: order-db
      DB_PORT: 5432
      DB_USER: ${ORDER_DB_USER}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      DB_NAME: ${ORDER_DB_NAME}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    depends_on:
      - order-db

  inventory-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME}
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
    volumes:
      - inventory_db_data:/var/lib/postgresql/data

  payment-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME}
      POSTGRES_USER: ${PAYMENT_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
    volumes:
      - payment_db_data:/var/lib/postgresql/data

  analytics-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${ANALYTICS_DB_NAME}
      POSTGRES_USER: ${ANALYTICS_DB_USER}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    volumes:
      - analytics_db_data:/var/lib/postgresql/data


  order-service-api:
    build: ./order-service/apis
    ports:
      - "8100:8000"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_HOST: pgbouncer
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      - order-db
      - pgbouncer
      - kafka-broker
    volumes:
      - ./order-service/apis:/app
      - order_static:/app/staticfiles

  order-service-worker:
    build: ./order-service/workers
    ports:
      - "9101:9100"
    environment:
      KAFKA_BROKERS: kafka-broker:9092
      KAFKA_GROUP_ID: order-service-worker
      POSTGRES_HOST: order-db
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_DB: ${ORDER_DB_NAME}
    depends_on:
      - order-db
      - kafka-broker
  

  inventory-service-api:
    build: ./inventory-service/apis
    ports:
      - "8200:8000"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME}
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
      POSTGRES_HOST: inventory-db
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      - inventory-db
      - kafka-broker
    volumes:
      - ./inventory-service/apis:/app
      - inventory_static:/app/staticfiles

  inventory-service-worker:
    build: ./inventory-service/workers
    ports:
      - "9102:9100"
    environment:
      KAFKA_BROKERS: kafka-broker:9092
      KAFKA_GROUP_ID: inventory-service-worker
      POSTGRES_HOST: inventory-db
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
      POSTGRES_DB: ${INVENTORY_DB_NAME}
    depends_on:
      - inventory-db
      - kafka-broker


  payment-service-api:
    build: ./payment-service/apis
    ports:
      - "8300:8000"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME}
      POSTGRES_USER: ${PAYMENT_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
      POSTGRES_HOST: payment-db
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      - payment-db
      - kafka-broker
    volumes:
      - ./payment-service/apis:/app
      - payment_static:/app/staticfiles

  payment-service-worker:
    build: ./payment-service/workers
    ports:
      - "9103:9100"
    environment:
      KAFKA_BROKERS: kafka-broker:9092
      KAFKA_GROUP_ID: payment-service-worker
      POSTGRES_HOST: payment-db
      POSTGRES_USER: ${PAYMENT_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
      POSTGRES_DB: ${PAYMENT_DB_NAME}
    depends_on:
      - payment-db
      - kafka-broker


  analytics-service-api:
    build: ./analytics-service/apis
    ports:
      - "8400:8000"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${ANALYTICS_DB_NAME}
      POSTGRES_USER: ${ANALYTICS_DB_USER}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      POSTGRES_HOST: analytics-db
    depends_on:
      - analytics-db
      - kafka-broker
    volumes:
      - ./analytics-service/apis:/app
      - analytics_static:/app/staticfiles

  analytics-service-worker:
    build: ./analytics-service/workers
    ports:
      - "9104:9100"
    environment:
      KAFKA_BROKERS: kafka-broker:9092
      KAFKA_GROUP_ID: analytics-workers
      POSTGRES_HOST: analytics-db
      POSTGRES_USER: ${ANALYTICS_DB_USER}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      POSTGRES_DB: ${ANALYTICS_DB_NAME}
    depends_on:
      - analytics-db
      - kafka-broker


  kafka-broker: # https://hub.docker.com/r/apache/kafka -> (Zookeeper is deprecated/removed as of Kafka 4.x - used the official KRaft-mode image (no Zookeeper needed):)
    image: apache/kafka:4.3.1
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3 # if auto-creation were enabled, this is how many partitions that new topic would get by default
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports:
      - "9092:9092"
    volumes:
    - kafka_data:/var/lib/kafka/data



  kafbat-ui: # https://hub.docker.com/r/kafbat/kafka-ui
    container_name: kafbat-ui
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - 8080:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:9092
    depends_on:
      - kafka-broker

  kafka-exporter: # https://github.com/danielqsj/kafka_exporter — reads consumer group lag from the broker
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command: ["--kafka.server=kafka-broker:9092"]
    ports:
      - "9308:9308"
    depends_on:
      - kafka-broker
    # depends_on only waits for the container to start, not for Kafka to
    # actually be listening (KRaft takes 10-30s+) — kafka-exporter fails
    # fatally on its first connection attempt and exits with no internal
    # retry, so without this it just stays Exited forever once it loses that
    # race, even though the broker comes up fine seconds later.
    restart: on-failure

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - kafka-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus


volumes:
  order_db_data:
  inventory_db_data:
  payment_db_data:
  analytics_db_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  order_static:
  inventory_static:
  payment_static:
  analytics_static: